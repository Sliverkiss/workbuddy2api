name: 功能请求
description: 提出新能力、行为变更或部署 / 配置体验改进
title: "[Feature] 一句话描述希望增加或改变什么"
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > 功能请求请聚焦**问题与目标**，而不是先给实现方案。仓库维护成本有限，请说明该需求的实际使用场景与频次，便于判断优先级。
        >
        > 每一项都必须填写。**不适用的写「不适用」，无法提供的写「无法提供」并说明原因。**

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前自检
      options:
        - label: 我已搜索现有 issues 与 Discussions，确认没有相同或相近的请求
          required: true
        - label: 我已确认该能力目前无法通过现有配置（见 README「配置说明」）实现
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前的具体痛点与场景，不要只写「希望支持 X」。
      placeholder: |
        我在 ___ 场景下需要 ___，但当前只能 ___，导致 ___（多花的时间 / 无法完成的事）。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的行为，含配置项名、默认值、与现有语义的关系（如与账号池 / 提示词 / 冷却策略的交互）。可给 API 或配置示例。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 现有哪些绕行手段、外部工具或改动较小的方案；为什么不满足。没有则写「不适用」。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      description: 预计受影响的子系统（可多选）。
      multiple: true
      options:
        - "OpenAI 兼容接口 / 协议行为"
        - "工具调用 / tool_calls"
        - "系统提示词体系"
        - "账号池 / 选号 / 会话粘性"
        - "熔断与冷却策略"
        - "定时任务"
        - "状态持久化 / Redis"
        - "可观测性（日志 / 健康检查）"
        - "部署与配置"
        - "文档"
        - "其他（在下方补充）"
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 相关环境
      description: 与需求相关的环境上下文；无关的可写「不适用」。
      value: |
        - 项目版本（release tag 或 commit hash）：
        - 部署方式：
        - 客户端与版本：
        - 使用场景与频次（如每日 N 次 / 仅测试环境）：
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意提交 PR 实现该功能
        - label: 我愿意协助测试并提供反馈

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 相关 issue 链接、上游限制说明、协议规范依据等。
    validations:
      required: false
